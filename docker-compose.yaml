version: '3.8'

services:

  # The Deploy controller
  deploy:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3999}
    ports:
      - "${PORT:-3999}:${PORT:-3999}"
    volumes:
      # CRITICAL: Gives the container power to control Docker on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mount SSH keys if your Git repo is private
      - ~/.ssh:/root/.ssh:ro 
      - ./data:/app/data
    restart: always
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:' + (process.env.PORT || 3999) + '/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
