version: '3.8'

services:

  # The Deploy controller
  deploy:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3999}
    ports:
      - "${PORT:-3999}:${PORT:-3999}"
    volumes:
      # CRITICAL: Gives the container power to control Docker on the host
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mount SSH keys if your Git repo is private
      - ~/.ssh:/root/.ssh:ro 
      - ./data:/app/data
    restart: always
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS "http://localhost:$${PORT:-3999}/health" >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
